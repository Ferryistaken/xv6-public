[package]
name = "rustnet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[dependencies]
smoltcp = { version = "0.12.0", default-features = false, features = [
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "medium-ethernet",
] }
